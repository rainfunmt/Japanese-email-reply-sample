<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日文書信帖</title>
<style>
  /*
    Layout concept: a stacked letter-paper column on a washi ground —
    the generator is the first panel (the writing desk), the four
    scenario cards below are a 範本帖 (sample book) to consult or copy from.

    This is a standalone local file (opened directly in a browser, not a
    Claude Artifact), so it supplies its own doctype/head and the small
    reset an Artifact skeleton would otherwise provide.
  */
  [hidden] { display: none !important; }
  :root {
    --bg: #f6f1e7;
    --surface: #fffdf8;
    --surface-2: #ece3cd;
    --fg: #22241f;
    --muted: #726b58;
    --border: #ddd0ac;
    --accent: #26415c;
    --accent-fg: #f6f1e7;
    --seal: #a13d2d;
    --ok: #3a6b4c;
    --font-display: "Shippori Mincho", "Noto Serif JP", serif;
    --font-body: "Noto Sans JP", "Noto Sans TC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a16;
      --surface: #242220;
      --surface-2: #2d2a25;
      --fg: #ece4d2;
      --muted: #a79f8a;
      --border: #3c3730;
      --accent: #8fb0d6;
      --accent-fg: #1b1a16;
      --seal: #e08a6d;
      --ok: #85c29a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a16;
    --surface: #242220;
    --surface-2: #2d2a25;
    --fg: #ece4d2;
    --muted: #a79f8a;
    --border: #3c3730;
    --accent: #8fb0d6;
    --accent-fg: #1b1a16;
    --seal: #e08a6d;
    --ok: #85c29a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.7;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 32px 64px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  header.hero { display: flex; flex-direction: column; gap: 8px; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--seal);
    font-weight: 600;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(26px, 5vw, 34px);
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.02em;
  }
  .lede { color: var(--muted); margin: 0; max-width: 60ch; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel h2 {
    font-family: var(--font-display);
    font-size: 19px;
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .panel h2 .num {
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 1px 8px;
    font-family: var(--font-body);
    letter-spacing: 0.04em;
  }

  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  .field { min-width: 0; }
  textarea, select, input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 84px; font-family: var(--font-body); }
  select, input[type="text"] { height: 40px; }
  .key-note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 560px) { .row-3, .row-2 { grid-template-columns: 1fr; } }
  .reason-panel { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .reason-fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 560px) { .reason-fields { grid-template-columns: 1fr; } }

  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    cursor: pointer;
  }
  button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }

  .status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .status.err { color: var(--seal); }

  .output { display: flex; flex-direction: column; gap: 14px; border-top: 1px dashed var(--border); padding-top: 14px; }
  .draft-box { position: relative; }
  .draft-box textarea { min-height: 220px; font-family: var(--font-body); white-space: pre-wrap; }
  .copy-btn { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 6px 10px; }

  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .chips li { font-size: 13px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .chips b { color: var(--accent); }
  .tips { margin: 0; padding-left: 18px; font-size: 13px; color: var(--fg); }
  .tips li { margin-bottom: 4px; }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .card-grid { grid-template-columns: 1fr; } }

  details.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    min-width: 0;
  }
  details.card summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  details.card summary::-webkit-details-marker { display: none; }
  .scenario-tag {
    font-family: var(--font-display);
    font-size: 16px;
  }
  .scenario-chevron { color: var(--muted); transition: transform 0.15s ease; }
  details.card[open] .scenario-chevron { transform: rotate(90deg); }
  .before-line { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .after-block { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .after-text {
    white-space: pre-wrap;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13.5px;
    overflow-x: auto;
  }
  .apply-btn { font-size: 12px; padding: 6px 10px; align-self: flex-start; }

  footer { font-size: 12px; color: var(--muted); text-align: center; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
</head>
<body>
<div class="page">
  <header class="hero">
    <span class="eyebrow">日文商務書信草稿工具</span>
    <h1>日文書信帖</h1>
    <p class="lede">選擇情境、對象關係和正式/委婉程度，套用固定的日文商務書信範本，並標出敬語等級和可以再調整的地方；下方也附了四種常見情境的完整範本可以直接參考。</p>
  </header>

  <section class="panel" id="generator">
    <h2><span class="num">1</span>產生草稿</h2>
    <p class="lede" style="margin:0;">範本是套好的固定內容，不會幫你翻譯「想表達的事」——那欄是留給你自己對照著把細節（商品名、日期、金額等）填進下方空格用的。</p>

    <div class="field">
      <label for="content">想表達的事（中文或英文皆可）</label>
      <textarea id="content" placeholder="例：這次出貨延遲了，想跟客戶道歉，說明是工廠設備問題，之後會準時出貨。"></textarea>
    </div>

    <div class="row-3">
      <div class="field">
        <label for="scenario">情境類型</label>
        <select id="scenario">
          <option value="apology">道歉</option>
          <option value="quote">報價</option>
          <option value="reminder">催交期</option>
          <option value="refusal">拒絕</option>
          <option value="other">其他</option>
        </select>
        <p class="key-note" id="scenarioHint"></p>
      </div>
      <div class="field">
        <label for="relation">對象關係</label>
        <select id="relation">
          <option>初次接觸</option>
          <option>長期往來客戶</option>
          <option>上級或重要客戶</option>
        </select>
      </div>
      <div class="field">
        <label for="formality">正式/委婉程度</label>
        <select id="formality">
          <option>一般丁寧</option>
          <option>更委婉謙讓</option>
          <option>嚴肅鄭重</option>
        </select>
      </div>
    </div>

    <div class="reason-panel" id="reasonPanel" hidden>
      <div class="field" style="margin:0;">
        <label for="reasonType" id="reasonTypeLabel">原因/補充說明類型（會自動套進下方日文正文）</label>
        <select id="reasonType"></select>
      </div>
      <div class="reason-fields" id="reasonFields"></div>
    </div>

    <div class="reason-panel" id="extraPanel" hidden>
      <div class="reason-fields" id="extraFields"></div>
    </div>

    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <button class="btn-primary" id="generateBtn" type="button">產生日文草稿</button>
      <span class="status" id="status"></span>
    </div>

    <div class="output" id="output" hidden>
      <div class="draft-box">
        <label for="draftText">日文草稿（可直接編輯）</label>
        <textarea id="draftText"></textarea>
        <button class="btn-ghost copy-btn" id="copyBtn" type="button">複製</button>
      </div>
      <div>
        <label>敬語等級標註</label>
        <ul class="chips" id="keigoList"></ul>
      </div>
      <div>
        <label>可依關係調整</label>
        <ul class="tips" id="tipsList"></ul>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2><span class="num">2</span>四種情境範本</h2>
    <p class="lede" style="margin:0;">點開查看完整草稿、敬語標註與可調整處；也可以「套用」把內容帶進上面的產生器再試著改寫。</p>
    <div class="card-grid" id="cardGrid"></div>
  </section>

  <footer>敬語標註僅供參考，正式發出前建議請日籍同事或熟悉商務日文的人協助校對。</footer>
</div>

<script>
(function () {
  "use strict";

  // Each scenario has three hand-written register variants (general / soft /
  // formal). {{REL}} inside a paragraph is replaced with a short clause from
  // RELATION_CLAUSES[scenario.id][relation] (may be "") — no AI involved,
  // so the output is always exactly one of these fixed texts.
  var SCENARIOS = [
    {
      id: "apology",
      label: "道歉",
      before: "上次出貨延遲了，想跟客戶道歉，說明原因是工廠線路出問題，之後會準時。",

      ],
      variants: {
        general: [
          "件名：出荷遅延のお詫び",

          "今後とも何卒よろしくお願い申し上げます。"
        ],
        soft: [
          "件名：出荷遅延のお詫び",
          "○○株式会社　○○様",
          "いつもお世話になっております。株式会社△△の◇◇でございます。",

        ],

          "発信日：202X年〇月〇日",

          "                                        株式会社△△\n                                        （部署名）〇〇 〇〇",
          "件名：【お詫び】ご注文商品の発送遅延について",
          "拝啓　平素は格別のご愛顧を賜り、厚く御礼申し上げます。\n株式会社△△の〇〇でございます。",
          "この度は、弊社製品「（商品名）」をご注文いただき、誠にありがとうございます。",
          "本日は、ご注文いただきました上記商品の発送につきまして、誠に勝手ながら\n予定日より遅れが生じる見込みとなりましたため、謹んでご報告かたがた\nお詫び申し上げます。",
          "{{REL}}〇〇様のご期待に沿えぬ結果となり、\n多大なるご迷惑をおかけしますことを、深くお詫び申し上げます。",
          "{{REASON}}",
          "現在、一日も早くお届けできるよう最優先で手配を進めております。\n変更内容につきましては、下記のとおりご案内申し上げます。",
          "記",
          "【ご注文内容】\n　商品名　　　　　：（商品名）\n　数量　　　　　　：（数量）点\n　当初の発送予定日：202X年〇月〇日（〇）",
          "【変更後のご案内】\n　発送予定日　　　：202X年〇月〇日（〇）\n　数量　　　　　　：（変更がある場合のみ記載）（数量）点",
          "以上",
          "商品のお届けまで、今しばらくお待ちいただけますよう伏してお願い申し上げます。\n今後はこのような不手際のないよう、生産および出荷体制の管理を徹底してまいります。",

          "敬具",
          "--------------------------------------------------\n株式会社△△\n[部署名]　[氏名]\n〒000-0000 [住所]\nTEL：03-0000-0000 / FAX：03-0000-0000\nMail：example@email.com\nURL：https://www.example.com\n--------------------------------------------------"
        ]
      }
    },
    {
      id: "quote",
      label: "報價",
      before: "想提供報價給客戶，附上價格明細，說明有效期限一個月，希望對方確認。",
      keigo: [

      ],
      variants: {
        general: [
          "件名：お見積りのご案内",

          "{{REL}}ご依頼いただきました件について、お見積りを添付の通りご案内申し上げます。\n{{REASON}}本お見積りの有効期限は、本日より{{VALIDITY}}となっております。",

          "よろしくお願いいたします。"
        ],
        soft: [
          "件名：お見積りのご案内",
          "○○株式会社　○○様",
          "お世話になっております。株式会社△△の◇◇です。",
          "{{REL}}ご依頼いただきました件につきまして、お見積りを添付のとおりご案内申し上げます。\n{{REASON}}ご予算やご希望に添えない点などございましたら、遠慮なくお申し付けください。\n内容の調整についても可能な限り対応させていただきます。",

          "よろしくお願いいたします。"
        ],
        formal: [
          "件名：【お見積りご案内】の件",

          "ご不明な点等ございましたら、何なりとお申し付けくださいませ。\n今後とも変わらぬお引き立てを賜りますよう、お願い申し上げます。",
          "敬具"
        ]
      }
    },
    {
      id: "reminder",
      label: "催交期",
      before: "東西還沒收到，想催廠商趕快交貨，但不要太兇。",
      keigo: [
        ["お伺いできますでしょうか", "謙譲語＋丁寧語。質問を控えめに、依頼のように述べる。"],

      ],
      tips: [

      ],
      variants: {
        general: [

        ],

  // mentions both "延遲" and "進度") stays with whatever the viewer already
  // picked instead of defaulting to whichever scenario happens to be listed
  // first in SCENARIO_KEYWORDS.
  function detectScenarioHint(content, selectedId) {
    var lower = content.toLowerCase();
    var scores = {};
    Object.keys(SCENARIO_KEYWORDS).forEach(function (id) {
      var score = 0;
      SCENARIO_KEYWORDS[id].forEach(function (kw) {
        if (lower.indexOf(kw.toLowerCase()) !== -1) { score++; }
      });
      scores[id] = score;
    });
    var bestScore = scores[selectedId] || 0;
    var best = null;
    Object.keys(scores).forEach(function (id) {
      if (id !== selectedId && scores[id] > bestScore) { bestScore = scores[id]; best = id; }
    });
    return best;
  }

  // Shared by the reason-menu panel and the extra-fields panel: both render
  // a list of {key, label, placeholder?} or {key, label, type:"select",
  // options, default} field configs as labeled inputs, and both later read
  // them back by the same "idPrefix + key" element id.
  function buildFieldRow(idPrefix, f) {
    var wrap = el("div", { class: "field" });
    wrap.appendChild(el("label", { for: idPrefix + f.key, text: f.label }));
    var input;
    if (f.type === "select") {
      input = el("select", { id: idPrefix + f.key });
      f.options.forEach(function (opt) {
        input.appendChild(el("option", { value: opt.value, text: opt.label }));
      });
      if (f.default) { input.value = f.default; }
    } else {
      input = el("input", { type: "text", id: idPrefix + f.key, autocomplete: "off" });
      if (f.placeholder) { input.placeholder = f.placeholder; }
    }
    wrap.appendChild(input);
    return wrap;
  }

    container.innerHTML = "";
    fields.forEach(function (f) { container.appendChild(buildFieldRow(idPrefix, f)); });

    return values;

    reminder: "禮貌地詢問/催促對方的交期或進度，不是在回覆對方的要求。",
    refusal: "明確婉拒對方的要求或訂單（數量、交期、價格、規格等都無法配合），這筆不會履行。",
    other: "目前沒有現成範本，請參考下方四個範例自己改寫，或挑一個最接近的情境。"
  };

  function renderScenarioHint() {
    document.getElementById("scenarioHint").textContent = SCENARIO_HINTS[document.getElementById("scenario").value] || "";
  }

  // Rebuilds the reason-type <select>'s own option list for the current
  // scenario (each scenario has a different menu), then its fields.
  function renderReasonFields() {
    renderScenarioHint();
    var menu = REASON_MENUS[document.getElementById("scenario").value];
    var panel = document.getElementById("reasonPanel");
    panel.hidden = !menu;
    if (menu) {
      var sel = document.getElementById("reasonType");
      sel.innerHTML = "";
      if (menu.blankLabel) { sel.appendChild(el("option", { value: "", text: menu.blankLabel })); }
      Object.keys(menu.options).forEach(function (key) {
        sel.appendChild(el("option", { value: key, text: menu.options[key].label }));
      });
      renderReasonFieldInputs();
    }
    renderExtraFields();
    pendingMismatchKey = null;
  }

  // Field ids are namespaced per entry (extraField_<token>_<key>), not just
  // per scenario — a scenario can hold several independent token-groups
  // (see EXTRA_FIELDS) and this keeps their field keys from colliding if two
  // groups ever reuse the same field name (e.g. both calling a field "date").
  function extraFieldPrefix(entry) { return "extraField_" + entry.token + "_"; }

  function renderExtraFields() {
    var entries = EXTRA_FIELDS[document.getElementById("scenario").value] || [];
    document.getElementById("extraPanel").hidden = entries.length === 0;
    var container = document.getElementById("extraFields");
    container.innerHTML = "";
    entries.forEach(function (entry) {
      entry.fields.forEach(function (f) { container.appendChild(buildFieldRow(extraFieldPrefix(entry), f)); });
    });
  }

  var pendingMismatchKey = null;

  function onGenerate() {
    var input = readFormInput();
    if (!input) {
      setStatus("請先輸入想表達的事，等一下自己對照著填入草稿空格。", true);
      return;
    }
    var scenario = SCENARIOS_BY_ID[input.scenarioId];
    if (!scenario) {
      setStatus("「其他」目前還沒有現成範本，請參考下方四個範例自己改寫，或挑一個最接近的情境。", true);
      return;
    }

    var suggested = detectScenarioHint(input.content, input.scenarioId);
    var mismatchKey = input.scenarioId + "::" + input.content;
    if (suggested && pendingMismatchKey !== mismatchKey) {
      pendingMismatchKey = mismatchKey;
      document.getElementById("output").hidden = true;
      setStatus(
        "你輸入的內容看起來比較像「" + SCENARIO_LABELS[suggested] + "」情境，但目前選的是「" + scenario.label +
        "」。確認沒問題的話，再按一次「產生日文草稿」即可送出；要修正的話請改選情境類型。",
        true
      );
      return;
    }
    pendingMismatchKey = null;

    var formalityKey = FORMALITY_KEY[input.formality] || "general";
    var tokens = { REL: (RELATION_CLAUSES[scenario.id] || {})[input.relation] || "" };

    var reasonTpl = currentReasonTemplate();
    if (reasonTpl) {
      tokens.REASON = reasonTpl.build(readFieldValues("reasonField_", reasonTpl.fields));
    }

    (EXTRA_FIELDS[scenario.id] || []).forEach(function (extra) {
      tokens[extra.token] = extra.build(readFieldValues(extraFieldPrefix(extra), extra.fields));
    });

    var draft = renderTemplate(scenario.variants[formalityKey], tokens);
    draft += "\n\n----------\n（你輸入的重點，請自行把細節填入上面的空格後刪除這段）\n" + input.content;

    renderResult({
      draft: draft,
      keigo: scenario.keigo,
      tips: scenario.tips
    });
    setStatus("已套用「" + scenario.label + "」的" + input.formality + "範本，請把方框、空格換成實際內容。");
  }

  renderCards();
  renderReasonFields();
  document.getElementById("scenario").addEventListener("change", renderReasonFields);
  document.getElementById("reasonType").addEventListener("change", renderReasonFieldInputs);
  document.getElementById("generateBtn").addEventListener("click", onGenerate);
  document.getElementById("copyBtn").addEventListener("click", function () {
    copyTextarea("draftText", document.getElementById("copyBtn"));
  });
})();
</script>
</body>
</html>
